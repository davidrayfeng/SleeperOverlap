<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleeper Ownership Finder</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --text:#15181e; --muted:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --hot:#dc2626; --chip:#eef2ff; --bar:#e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1116; --card:#171b22; --text:#e8eaee; --muted:#8b94a3; --line:#262c36;
      --accent:#5b9bff; --hot:#f87171; --chip:#1e2740; --bar:#262c36; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:1080px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input, select, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line);
    border-radius:8px; padding:8px 12px; }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.6; cursor:wait; }
  #status { color:var(--muted); margin-top:10px; min-height:1.4em; }
  .err { color:var(--hot) !important; }
  .grid { display:grid; grid-template-columns:300px 1fr; gap:16px; align-items:start; }
  @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
  h3 { margin:0 0 10px; font-size:15px; }
  .plist { display:flex; flex-direction:column; gap:4px; max-height:560px; overflow-y:auto; }
  .pbtn { text-align:left; display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px;
    border:1px solid transparent; background:transparent; width:100%; }
  .pbtn:hover { background:var(--bg); }
  .pbtn.sel { background:var(--chip); border-color:var(--accent); }
  .pbtn .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pbtn .top { font-size:12px; color:var(--muted); white-space:nowrap; }
  .pos { display:inline-block; font-size:11px; font-weight:700; padding:1px 6px; border-radius:5px; background:var(--chip); }
  .tag { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
    padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr.item { cursor:pointer; }
  tr.item:hover td { background:var(--bg); }
  tr.dim td { opacity:.55; }
  tr.detail td { background:var(--bg); }
  .num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .pct { font-weight:700; font-size:16px; }
  .bar { height:8px; border-radius:4px; background:var(--bar); min-width:90px; overflow:hidden; }
  .bar span { display:block; height:100%; background:var(--accent); }
  .badge { font-size:12px; padding:1px 8px; border-radius:999px; background:var(--chip); margin-left:4px; white-space:nowrap; }
  .detail h4 { margin:8px 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .detail ul { margin:0; padding-left:18px; }
  .empty { text-align:center; color:var(--muted); padding:30px; }
  .hidden { display:none; }
  progress { width:100%; height:8px; margin-top:8px; }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sleeper Ownership Finder</h1>
  <p class="sub">Pick a league, pick a player on your team, and see how heavily each manager in that league owns him across <em>all</em> of their leagues, including leagues you're not in.</p>

  <div class="card">
    <div class="row">
      <input id="username" placeholder="Sleeper username" autocomplete="off" style="min-width:200px">
      <input id="season" type="number" style="width:100px" title="Season">
      <button id="go" class="primary">Load my leagues</button>
      <select id="leagueSel" class="hidden" style="min-width:240px"></select>
    </div>
    <div id="status"></div>
    <progress id="prog" class="hidden" value="0" max="1"></progress>
  </div>

  <div id="main" class="grid hidden">
    <div class="card">
      <h3>Your players in this league</h3>
      <input id="psearch" placeholder="Filter players…" style="width:100%;margin-bottom:8px">
      <div id="plist" class="plist"></div>
    </div>
    <div class="card">
      <h3 id="resTitle">Select a player</h3>
      <p class="tag" id="resNote"></p>
      <div class="scroll">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const API = "https://api.sleeper.app/v1";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const POS_ORDER = { QB:0, RB:1, WR:2, TE:3, K:4, DEF:5 };

let PLAYERS = {}, myId = null;
let leagues = [];                 // {id,name,rosters:[{uids,players:Set}],users:Map}
let rosterCache = new Map();      // leagueId -> Promise(raw rosters)
let mgr = new Map();              // uid -> {leagues:[{id,name,players:Set}], failed, total, done}
let curLeague = null, selPid = null;
const expanded = new Set();
const myLeagueIds = () => new Set(leagues.map(l => l.id));

function setStatus(msg, err) { const s = $("status"); s.textContent = msg; s.className = err ? "err" : ""; }

async function getJSON(url, tries = 4) {
  for (let i = 0; i < tries; i++) {
    let r;
    try { r = await fetch(url); }
    catch (e) {
      if (i === tries - 1) throw new Error("Could not reach api.sleeper.app. Open this file directly from your computer (not inside a preview) and check for ad/privacy blockers.");
      await sleep(500 * (i + 1)); continue;
    }
    if (r.status === 429) { await sleep(1500 * (i + 1)); continue; }
    if (!r.ok) throw new Error(`Sleeper API ${r.status} for ${url.replace(API, "")}`);
    return r.json();
  }
  throw new Error("Rate limited by Sleeper; try again in a minute.");
}
async function pool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) await fn(items[i++]);
  }));
}

/* Player DB cache (IndexedDB, 24h) */
function idb() { return new Promise((res, rej) => { const rq = indexedDB.open("sleeper-overlap", 1); rq.onupgradeneeded = () => rq.result.createObjectStore("kv"); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); }
async function idbGet(k) { try { const db = await idb(); return await new Promise(r => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); } catch { return null; } }
async function idbSet(k, v) { try { const db = await idb(); db.transaction("kv", "readwrite").objectStore("kv").put(v, k); } catch {} }
async function loadPlayers() {
  const c = await idbGet("players");
  if (c && Date.now() - c.t < 24 * 3600 * 1000) return c.data;
  setStatus("Downloading player database (one-time, cached for 24h)…");
  const data = await getJSON(`${API}/players/nfl`);
  await idbSet("players", { t: Date.now(), data });
  return data;
}
function playerInfo(id) {
  const p = PLAYERS[id];
  if (!p) return { name: `Unknown (${id})`, pos: "?", team: "" };
  const pos = p.position || (p.fantasy_positions && p.fantasy_positions[0]) || "?";
  const name = pos === "DEF" ? `${p.team || id} D/ST` : (p.full_name || `${p.first_name || ""} ${p.last_name || ""}`.trim() || id);
  return { name, pos, team: p.team || "FA" };
}

/* ---------- Load my leagues ---------- */
async function load() {
  const username = $("username").value.trim(), season = $("season").value.trim();
  if (!username) return setStatus("Enter your Sleeper username.", true);
  $("go").disabled = true; $("main").classList.add("hidden"); $("leagueSel").classList.add("hidden");
  mgr = new Map(); rosterCache = new Map(); selPid = null; curLeague = null;
  try { localStorage.setItem("sleeper-username", username); } catch {}
  try {
    setStatus("Finding your account…");
    const user = await getJSON(`${API}/user/${encodeURIComponent(username)}`);
    if (!user || !user.user_id) throw new Error("User not found.");
    myId = user.user_id;
    const [players, lgs] = await Promise.all([loadPlayers(), getJSON(`${API}/user/${myId}/leagues/nfl/${season}`)]);
    PLAYERS = players;
    if (!lgs.length) throw new Error(`No NFL leagues found for ${username} in ${season}.`);
    let done = 0;
    setStatus(`Loading leagues (0/${lgs.length})…`);
    const all = await Promise.all(lgs.map(async lg => {
      const [rosters, users] = await Promise.all([
        getJSON(`${API}/league/${lg.league_id}/rosters`),
        getJSON(`${API}/league/${lg.league_id}/users`)
      ]);
      rosterCache.set(lg.league_id, Promise.resolve(rosters));
      setStatus(`Loading leagues (${++done}/${lgs.length})…`);
      const um = new Map();
      users.forEach(u => um.set(u.user_id, { name: u.display_name, team: (u.metadata && u.metadata.team_name) || "" }));
      return { id: lg.league_id, name: lg.name, users: um,
        rosters: rosters.map(r => ({ uids: [r.owner_id, ...(r.co_owners || [])].filter(Boolean), players: new Set(r.players || []) })) };
    }));
    leagues = all.filter(l => l.rosters.some(r => r.uids.includes(myId)));
    const sel = $("leagueSel");
    sel.innerHTML = `<option value="">Select a league…</option>` + leagues.map(l => `<option value="${esc(l.id)}">${esc(l.name)}</option>`).join("");
    sel.classList.remove("hidden");
    setStatus(`Loaded ${leagues.length} leagues. Choose one to begin.`);
  } catch (e) { setStatus(e.message || String(e), true); }
  finally { $("go").disabled = false; }
}

/* ---------- Select league → scan its managers ---------- */
async function selectLeague(id) {
  selPid = null; expanded.clear();
  curLeague = leagues.find(l => l.id === id) || null;
  if (!curLeague) { $("main").classList.add("hidden"); return; }
  $("main").classList.remove("hidden");
  $("psearch").value = "";
  renderPlayers(); renderResult();
  const season = $("season").value.trim();
  const uids = [...new Set(curLeague.rosters.flatMap(r => r.uids))].filter(u => u !== myId && !(mgr.get(u) && mgr.get(u).done));
  if (!uids.length) return;
  const prog = $("prog"); prog.classList.remove("hidden"); prog.max = uids.length; prog.value = 0;
  let mDone = 0;
  const thisLeague = curLeague.id;
  setStatus(`Scanning ${uids.length} managers' leagues…`);
  await pool(uids, 4, async uid => {
    const rec = { leagues: [], failed: 0, total: 0, done: false };
    mgr.set(uid, rec);
    try {
      const theirs = await getJSON(`${API}/user/${uid}/leagues/nfl/${season}`);
      rec.total = theirs.length;
      await pool(theirs, 4, async lg => {
        try {
          if (!rosterCache.has(lg.league_id)) rosterCache.set(lg.league_id, getJSON(`${API}/league/${lg.league_id}/rosters`));
          const rosters = await rosterCache.get(lg.league_id);
          const r = rosters.find(x => x.owner_id === uid || (x.co_owners || []).includes(uid));
          if (r) rec.leagues.push({ id: lg.league_id, name: lg.name, players: new Set(r.players || []) });
          else rec.failed++;
        } catch { rec.failed++; rosterCache.delete(lg.league_id); }
      });
    } catch { rec.failed++; }
    rec.done = true;
    prog.value = ++mDone;
    if (curLeague && curLeague.id === thisLeague) { renderPlayers(); renderResult(); }
  });
  prog.classList.add("hidden");
  setStatus(`Done scanning ${curLeague.name}.`);
}

/* ---------- Ownership calc ---------- */
function ownership(uid, pid) {
  const rec = mgr.get(uid);
  if (!rec || !rec.done) return null;
  const pool = rec.leagues.filter(l => l.id !== curLeague.id);   // exclude this league (you own him here)
  const owned = pool.filter(l => l.players.has(pid));
  const mine = myLeagueIds();
  return { owned, total: pool.length, rate: pool.length ? owned.length / pool.length : 0,
    shared: owned.filter(l => mine.has(l.id)), outside: owned.filter(l => !mine.has(l.id)),
    failed: rec.failed, pool };
}
function leagueMates() {
  const seen = new Set();
  return curLeague.rosters.flatMap(r => r.uids).filter(u => u !== myId && !seen.has(u) && seen.add(u));
}
function myPlayersHere() {
  const r = curLeague.rosters.find(x => x.uids.includes(myId));
  return [...(r ? r.players : [])].map(pid => ({ pid, ...playerInfo(pid) }))
    .sort((a, b) => (POS_ORDER[a.pos] ?? 9) - (POS_ORDER[b.pos] ?? 9) || a.name.localeCompare(b.name));
}

/* ---------- Render ---------- */
function renderPlayers() {
  if (!curLeague) return;
  const q = $("psearch").value.trim().toLowerCase();
  const mates = leagueMates();
  $("plist").innerHTML = myPlayersHere().filter(p => !q || p.name.toLowerCase().includes(q)).map(p => {
    let best = null;
    mates.forEach(u => { const o = ownership(u, p.pid); if (o && o.owned.length && (!best || o.rate > best.rate)) best = { rate: o.rate, uid: u }; });
    const top = best ? `top ${Math.round(best.rate * 100)}%` : "";
    return `<button class="pbtn ${p.pid === selPid ? "sel" : ""}" data-pid="${esc(p.pid)}">
      <span class="pos">${esc(p.pos)}</span><span class="nm">${esc(p.name)}</span><span class="top">${top}</span></button>`;
  }).join("") || `<div class="tag">No players.</div>`;
  $("plist").querySelectorAll(".pbtn").forEach(b => b.onclick = () => { selPid = b.dataset.pid; expanded.clear(); renderPlayers(); renderResult(); });
}

function renderResult() {
  const th = $("thead"), tb = $("tbody");
  if (!curLeague || !selPid) {
    $("resTitle").textContent = "Select a player";
    $("resNote").textContent = "Choose one of your players on the left.";
    th.innerHTML = ""; tb.innerHTML = ""; return;
  }
  const info = playerInfo(selPid);
  $("resTitle").textContent = `${info.name} · ${info.pos} ${info.team}`;
  $("resNote").textContent = `Ownership rate of each manager in ${curLeague.name}, counted across all of their other leagues (this league excluded). The top-line number is leagues owned / leagues checked.`;
  th.innerHTML = `<tr><th>Manager</th><th>Owns him in</th><th>Rate</th><th></th><th>Where</th></tr>`;

  const rows = leagueMates().map(uid => {
    const u = curLeague.users.get(uid) || { name: uid, team: "" };
    return { uid, u, o: ownership(uid, selPid) };
  });
  rows.sort((a, b) => {
    if (!a.o && !b.o) return 0; if (!a.o) return 1; if (!b.o) return -1;
    return b.o.rate - a.o.rate || b.o.owned.length - a.o.owned.length;
  });

  tb.innerHTML = rows.map(({ uid, u, o }) => {
    const nameCell = `<strong>${esc(u.name)}</strong>${u.team ? `<div class="tag">${esc(u.team)}</div>` : ""}`;
    if (!o) return `<tr class="dim"><td>${nameCell}</td><td colspan="4" class="tag">scanning…</td></tr>`;
    const pct = Math.round(o.rate * 100);
    let h = `<tr class="item ${o.owned.length ? "" : "dim"}" data-id="${esc(uid)}">
      <td>${nameCell}</td>
      <td class="num">${o.owned.length} / ${o.total}${o.failed ? ` <span class="tag" title="Some leagues could not be loaded">(+${o.failed} unchecked)</span>` : ""}</td>
      <td class="num pct" style="${pct >= 50 ? "color:var(--hot)" : ""}">${pct}%</td>
      <td style="width:110px"><div class="bar"><span style="width:${pct}%"></span></div></td>
      <td>${o.owned.length ? `<span class="badge">${o.shared.length} with you</span><span class="badge">${o.outside.length} without you</span>` : ""}</td></tr>`;
    if (expanded.has(uid)) {
      h += `<tr class="detail"><td colspan="5">`;
      if (o.owned.length) {
        h += `<h4>Owns ${esc(info.name)} in</h4><ul>` + o.owned.map(l => `<li>${esc(l.name)}${myLeagueIds().has(l.id) ? ' <span class="badge">you\'re in this league</span>' : ""}</li>`).join("") + `</ul>`;
      } else h += `<div class="tag">Doesn't own him in any of their ${o.total} other leagues.</div>`;
      const notOwned = o.pool.length - o.owned.length;
      h += `<h4>Doesn't own him in</h4><div class="tag">${notOwned} league${notOwned === 1 ? "" : "s"}</div>`;
      h += `</td></tr>`;
    }
    return h;
  }).join("");

  tb.querySelectorAll("tr.item").forEach(tr => tr.onclick = () => {
    const id = tr.dataset.id; expanded.has(id) ? expanded.delete(id) : expanded.add(id); renderResult();
  });
}

$("go").onclick = load;
$("leagueSel").onchange = e => selectLeague(e.target.value);
$("psearch").addEventListener("input", renderPlayers);
$("username").addEventListener("keydown", e => { if (e.key === "Enter") load(); });

(async () => {
  $("season").value = new Date().getFullYear();
  try { const st = await getJSON(`${API}/state/nfl`); if (st && st.season) $("season").value = st.season; } catch {}
  try { const u = localStorage.getItem("sleeper-username"); if (u) $("username").value = u; } catch {}
})();
</script>
</body>
</html>
